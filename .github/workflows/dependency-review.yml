name: dependency-review

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  dependency-review:
    name: dependency-review
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Run dependency policy audit
        run: |
          python tools/dependency_policy_audit.py \
            --root "$GITHUB_WORKSPACE" \
            --format markdown \
            --fail-on high
