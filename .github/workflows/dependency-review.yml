name: dependency-review

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Dependency review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: always

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Local dependency policy audit
        run: python tools/dependency_policy_audit.py --root "$PWD" --format markdown --fail-on high
