name: CI

on:
  push:
    branches:
      - main
      - "release/**"
  pull_request:
    branches:
      - main

jobs:
  static-test-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff
        run: python -m ruff check app tests

      - name: Tests
        run: python -m pytest -q

      - name: Coverage
        run: python -m pytest --cov=app --cov-report=term-missing -q

      - name: Compile
        run: python -m compileall -q app tests

      - name: Validate config
        run: python -m app.cli validate-config

      - name: Scenario status
        run: python -m app.cli status --scenario cbdc_payment_resilience --window 30d
