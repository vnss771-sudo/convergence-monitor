[build-system]
requires = ["setuptools>=68,<83", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "convergence-monitor"
version = "0.1.0"
description = "Public-document convergence monitor for institutional macro-risk scenarios"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "httpx>=0.27.0",
    "python-dateutil>=2.9.0",
    "defusedxml>=0.7.1",
]

[project.optional-dependencies]
# feedparser is optional: ingestion falls back to a stdlib RSS/Atom parser when it
# is absent (see app/ingestion/rss_base.py). It is kept out of the default install
# because its transitive sdist dependency (sgmllib3k) fails to build under modern
# setuptools. Install with `pip install -e '.[parse]'` for the richer parser.
parse = [
    "feedparser>=6.0.11",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "coverage>=7.0.0",
    "hypothesis>=6.0.0",
    "ruff>=0.5.0",
]

[project.scripts]
convergence-monitor = "app.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
branch = true
source = ["app"]

[tool.ruff]
line-length = 100

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["config*", "data*", "docs*", "tests*"]
